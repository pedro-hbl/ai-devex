[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-devex"
version = "0.1.0"
description = "Track and report AI-assisted development in your repositories."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Pedro Henrique Lopes" }
]
keywords = ["ai", "developer-experience", "cli", "git", "transparency"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "jinja2>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
ai-devex = "ai_devex.cli:main"

[project.urls]
Homepage = "https://github.com/pedro-hbl/ai-devex"
Repository = "https://github.com/pedro-hbl/ai-devex"
Issues = "https://github.com/pedro-hbl/ai-devex/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_devex"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
